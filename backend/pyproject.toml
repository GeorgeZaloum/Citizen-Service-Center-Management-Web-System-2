[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DJ"]
# DJ001: the ERD defines nullable text columns (national_id must be NULL, not "", to stay unique).
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "shared", "apps"]
